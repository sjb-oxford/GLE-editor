name: Build mac app

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build mac app
        run: |
          pyinstaller --noconfirm --windowed --name "GLE Editor" --icon icon.icns \
            --add-data "icon.iconset:icon.iconset" \
            --add-data "icon.png:." \
            --add-data "gle-icon-large.png:." \
            --add-data "assets:assets" \
            gle_launcher.py

      - name: Zip the app
        run: |
          ditto -c -k --keepParent "dist/GLE Editor.app" "GLE-Editor-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: GLE-Editor-macOS.zip
